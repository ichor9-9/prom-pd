  });
  saveToStorage();
  if (render) renderShotRows();
}

function deleteShot(shotId) {
  if (state.shots.length <= 1) {
    const s = state.shots[0];
    Object.assign(s, { refs:[], angle:'', shotSize:'', cameraMove:'', duration:'', dialogue:'', memo:'' });
  } else {
    state.shots = state.shots.filter(s => s.id !== shotId);
  }
  saveToStorage();
  renderShotRows();
}

function updateShot(shotId, field, value) {
  const s = state.shots.find(s => s.id === shotId);
  if (s) { s[field] = value; saveToStorage(); }
}

function setupDragDrop() {
  const tbody = document.getElementById('shot-tbody');
  if (!tbody) return;
  let srcId = null;

  tbody.querySelectorAll('tr').forEach(tr => {
    tr.addEventListener('dragstart', e => {
      srcId = tr.dataset.id; tr.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    tr.addEventListener('dragend', () => {
      tr.classList.remove('dragging');
      tbody.querySelectorAll('tr').forEach(r => r.classList.remove('drag-over'));
    });
    tr.addEventListener('dragover', e => {
      e.preventDefault();
      tbody.querySelectorAll('tr').forEach(r => r.classList.remove('drag-over'));
      if (tr.dataset.id !== srcId) tr.classList.add('drag-over');
    });
    tr.addEventListener('drop', e => {
      e.preventDefault();
      if (!srcId || tr.dataset.id === srcId) return;
      const si = state.shots.findIndex(s => s.id === srcId);
      const di = state.shots.findIndex(s => s.id === tr.dataset.id);
      if (si < 0 || di < 0) return;
      const [moved] = state.shots.splice(si, 1);
      state.shots.splice(di, 0, moved);
      saveToStorage(); renderShotRows();
    });
  });
}

// ═══════════════════════════════════════════
// LLM ROUTER
// ═══════════════════════════════════════════
function getActiveApiKey() {
  return localStorage.getItem(`revon_apikey_${state.apiProvider}`) || '';
}

async function callLLM(messages, systemPrompt, maxTokens = 1200) {
  const key = getActiveApiKey();
  if (!key) throw new Error(`${state.apiProvider.toUpperCase()} API 키가 등록되지 않았습니다.\n오른쪽 패널 하단에서 키를 입력하고 저장하세요.`);

  const model = state.apiModel;
  if (state.apiProvider === 'claude') {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true' },
      body: JSON.stringify({ model, max_tokens: maxTokens, system: systemPrompt, messages }),
    });
    if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.error?.message || `HTTP ${res.status}`); }
    const d = await res.json();
    return d.content?.[0]?.text || '';
  }
  if (state.apiProvider === 'gpt') {
    const msgs = systemPrompt ? [{ role:'system', content: systemPrompt }, ...messages] : messages;
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type':'application/json','Authorization':`Bearer ${key}` },
      body: JSON.stringify({ model, max_tokens: maxTokens, messages: msgs }),
    });
    if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.error?.message || `HTTP ${res.status}`); }
    const d = await res.json();
    return d.choices?.[0]?.message?.content || '';
  }
  if (state.apiProvider === 'gemini') {
    const parts = [];
    if (systemPrompt) parts.push({ text: systemPrompt + '\n\n---\n' });
    messages.forEach(m => {
      if (Array.isArray(m.content)) {
        m.content.forEach(c => {
          if (c.type === 'text') parts.push({ text: c.text });
          else if (c.type === 'image') parts.push({ inline_data: { mime_type: c.source.media_type, data: c.source.data } });
        });
      } else {
        parts.push({ text: m.content });
      }
    });
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ contents: [{ parts }], generationConfig: { maxOutputTokens: maxTokens } }),
    });
    if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.error?.message || `HTTP ${res.status}`); }
    const d = await res.json();
    return d.candidates?.[0]?.content?.parts?.[0]?.text || '';
  }
  throw new Error('지원되지 않는 프로바이더');
}

// ═══════════════════════════════════════════
// GENERATE PROMPT
// ═══════════════════════════════════════════
async function generatePrompt() {
  if (!getActiveApiKey()) {
    showRightError(`${state.apiProvider.toUpperCase()} API 키를 먼저 입력하고 저장하세요.`);
    return;
  }

  if (state.shotMode === 'multi') { await generateMultiPrompt(); return; }

  const s = state.singleShot;
  if (!s.description.trim() && !s.refs.length) {
    showRightError('가운데 패널에서 장면 설명 또는 참조 시트를 먼저 입력해주세요.');
    return;
  }

  showRightLoading();

  try {
    const content = buildUserContent();
    const raw = await callLLM([{ role:'user', content }], buildSystemPrompt(), 1400);
    const jsonMatch = raw.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('응답을 파싱할 수 없습니다:\n' + raw.slice(0, 300));
    const parsed = JSON.parse(jsonMatch[0]);

    state.generatedParts = parsed.parts || {};
    state.generatedKorean = parsed.korean || {};
    state.generatedFinal = parsed.final || '';
    state.generatedFinalKorean = parsed.final_korean || '';
    state.promptStale = false;
    document.getElementById('right-platform-badge')?.classList.remove('stale');
    saveToStorage();
    renderPromptOutput();

  } catch (e) {
    showRightError(e.message || '알 수 없는 오류');
  }
}

// ── Build system prompt per platform ──────────────
function buildSystemPrompt() {
  const p = state.platform || 'kling';
  const rules = {
    kling: `You are an expert AI video prompt engineer for Kling 3.0.
Syntax: Subject + Subject Movement + Scene + Camera Language + Lighting & Atmosphere.
References: @image1, @image2 ... in upload order (1-indexed per sheet order).
Camera: explicit terms only — "slow dolly-in", "tracking shot from behind", "static low angle".
NEVER use vague terms like "cinematic movement" or "dynamic camera".
Image-to-video: describe ONLY movement and camera, not what is already visible in the image.
Append negative prompt at end of final: "|| cartoonish, 3D render, floating limbs, sliding feet, text morphing"`,

    runway: `You are an expert AI video prompt engineer for Runway Gen-4.
Rule: images define the scene; the prompt defines movement ONLY.
NEVER use negative prompts (they cause opposite results). Use ONLY positive descriptions.
Camera: "The camera [movement] as the subject [action]."
Sequential: "X occurs, then Y occurs. Finally, Z occurs."
Keep final prompt SHORT and precise — fewer words = better results.`,

    seedance: `You are an expert AI video prompt engineer for Seedance 2.0 (ByteDance).
References: use @AssetName syntax matching the sheet label exactly (e.g. @인물_주인공).
Time markers: "at the 5-second mark", "starting from the beginning".
Supports multi-shot consistency in one prompt.
Precise spatial: "in the background behind", complex multi-subject scenes supported.`,

    hailuo: `You are an expert AI video prompt engineer. Apply general best practices for Hailuo (MiniMax). Platform-specific guidelines are not yet confirmed — use cinematic descriptive style.`,

    sora: `You are an expert AI video prompt engineer for Sora (OpenAI).
Prefer natural language with detailed, specific descriptions.
Describe physical laws, material textures, and spatial relationships explicitly.`,

    wan: `You are an expert AI video prompt engineer. Apply general best practices for Wan 2.1 (Alibaba). Platform-specific guidelines are not yet confirmed — use descriptive cinematic style.`,
  };

  return `${rules[p] || rules.kling}

CRITICAL RULES:
1. All prompt text (parts, final) MUST be in English (translate any Korean input).
2. Reference sheets: mention them as [SheetLabel] where relevant, e.g. "character reference [인물_주인공]".
3. Output ONLY a single valid JSON object — no markdown, no code fences, no explanation.
4. SAFETY: Keep all content suitable for AI video platforms. Describe intense scenes cinematically without explicit violence, sexual content, or policy-violating material.
5. Required JSON structure:
{
  "parts": {
    "인물": "<subject/character — omit if no character info>",
    "장소": "<location/setting — omit if no location info>",
    "카메라": "<camera movement and framing>",
    "분위기": "<mood, style, lighting>",
    "대사": "<dialogue — omit if none>",
    "초수": "<e.g. 5s>"
  },
  "korean": {
    "인물": "<한글로 인물 설명>",
    "장소": "<한글로 장소 설명>",
    "카메라": "<한글로 카메라 설명>",
    "분위기": "<한글로 분위기 설명>",
    "초수": "<e.g. 5초>"
  },
  "final": "<complete platform-ready English prompt, single paragraph>",
  "final_korean": "<한글로 전체 장면 요약 (1~2문장)>"
}
Omit part keys that have no relevant content. Always include 카메라, 분위기, 초수.`;
}

// ── Build user message content (text + images) ────
function buildUserContent() {
  const s = state.singleShot;
  const content = [];
  let imgCounter = 1;

  s.refs.forEach(label => {
    if (label.startsWith('ri::')) {
      const ri = (state.refImages || []).find(r => r.id === label.slice(4));
      if (!ri) return;
      content.push({ type:'text', text:`=== Reference Image: [${ri.name}] ===` });
      content.push({ type:'image', source:{ type:'base64', media_type:ri.mimeType||'image/jpeg', data:ri.dataUrl.split(',')[1] }});
      imgCounter++;
      return;
    }
    const sheet = state.sheets[label];
    if (!sheet) return;

    content.push({ type: 'text', text: `=== Reference Sheet: [${label}] (Category: ${sheet.category}) ===` });

    const fieldLines = Object.entries(sheet.fields)
      .filter(([, v]) => v && (Array.isArray(v) ? v.length : String(v).trim()))
      .map(([k, v]) => `  ${k}: ${Array.isArray(v) ? v.join(', ') : v}`)
      .join('\n');
    if (fieldLines) content.push({ type: 'text', text: fieldLines });

    sheet.images.forEach(img => {
      content.push({ type: 'text', text: `Image ${imgCounter} for [${label}]:` });
      content.push({
        type: 'image',
        source: { type: 'base64', media_type: img.mimeType || 'image/jpeg', data: img.dataUrl.split(',')[1] },
      });
      imgCounter++;
    });
  });

  const CAM_LABEL  = { 'static':'Static (fixed)','dolly-in':'Dolly in','dolly-out':'Dolly out','pan':'Panning','tilt-up':'Tilt up','tilt-down':'Tilt down','tracking':'Tracking shot','orbit':'Orbit','crane-up':'Crane up','handheld':'Handheld','drone':'Drone/aerial' };
  const MOOD_LABEL = { 'cinematic':'Cinematic','documentary':'Documentary','dreamy':'Dreamy/ethereal','dark-rough':'Dark and gritty','bright-clean':'Bright and clean','noir':'Noir','warm-nostalgic':'Warm and nostalgic','cold-tense':'Cold and tense','grand-dramatic':'Grand and dramatic','natural-realistic':'Natural and realistic' };
  const LIGHT_LABEL= { 'golden-hour':'Golden hour','blue-hour':'Blue hour','night':'Late night','clear-day':'Clear daytime','overcast':'Overcast/cloudy','indoor-warm':'Warm indoor lighting','neon-city':'Neon city nightscape' };

  const ANGLE_LABEL = {'eye-level':'Eye level','low':'Low angle','high':'High angle','bird':'Bird\'s eye / overhead','worm':'Worm\'s eye','dutch':'Dutch angle','ots':'Over the shoulder','pov':'POV'};
  const SIZE_LABEL  = {'ews':'Extreme wide shot','ws':'Wide shot','fs':'Full shot','mws':'Medium wide shot','ms':'Medium shot','mcu':'Medium close-up','cu':'Close-up','ecu':'Extreme close-up'};

  const lines = [
    `Platform: ${PLATFORM_LABELS[state.platform] || state.platform}`,
    s.description  ? `Scene description: ${s.description}` : '',
    s.shotSize     ? `Shot size: ${SIZE_LABEL[s.shotSize] || s.shotSize}` : '',
    s.angle        ? `Camera angle: ${ANGLE_LABEL[s.angle] || s.angle}` : '',
    s.cameraMove   ? `Camera move: ${CAM_LABEL[s.cameraMove] || s.cameraMove}` : 'Camera move: AI determines',
    s.mood         ? `Mood/Style: ${MOOD_LABEL[s.mood] || s.mood}` : '',
    s.lighting     ? `Lighting: ${LIGHT_LABEL[s.lighting] || s.lighting}` : '',
    s.ratio        ? `Aspect ratio: ${s.ratio}` : '',
    s.duration     ? `Duration: ${s.duration} seconds` : 'Duration: AI determines',
    s.dialogue     ? `Dialogue: "${s.dialogue}"` : '',
    s.refs.length  ? `Referenced sheets (in order): ${s.refs.join(', ')}` : '',
  ].filter(Boolean).join('\n');

  content.push({ type: 'text', text: `\n=== Shot Settings ===\n${lines}\n\nGenerate the prompt now. Return ONLY valid JSON.` });
  return content;
}

// ── Part revise ───────────────────────────────────
function toggleRevise(key) {
  const area = document.getElementById(`edit-area-${key}`);
  const btn  = document.querySelector(`.prompt-part[data-key="${key}"] .part-revise-btn`);
  if (!area) return;
  const open = area.classList.contains('visible');
  area.classList.toggle('visible', !open);
  btn?.classList.toggle('active', !open);
  if (!open) area.querySelector('textarea')?.focus();
}

function cancelRevise(key) {
  const area = document.getElementById(`edit-area-${key}`);
  const btn  = document.querySelector(`.prompt-part[data-key="${key}"] .part-revise-btn`);
  area?.classList.remove('visible');
  if (area) area.querySelector('textarea').value = '';
  btn?.classList.remove('active');
}

async function submitRevise(key) {
  const area = document.getElementById(`edit-area-${key}`);
  const instruction = area?.querySelector('textarea')?.value?.trim();
  if (!instruction) return;

  const confirmBtn = area.querySelector('.btn-confirm');
  if (confirmBtn) { confirmBtn.disabled = true; confirmBtn.textContent = '...'; }

  // key format: "partKey" (single) or "cutIdx::partKey" (multi)
  const isCut = key.includes('::');
  const [cutPart, partKey] = isCut ? key.split('::') : [null, key];
  const cutIdx = isCut ? parseInt(cutPart) : null;

  const currentVal = isCut
    ? (state.multiShot?.generatedShots?.[cutIdx]?.parts?.[partKey] || '')
    : (state.generatedParts[partKey] || '');

  try {
    const revised = (await callLLM([{
      role: 'user',
      content: `Revise this AI video prompt part.\n\nPart key: [${partKey}]\nCurrent text: "${currentVal}"\nRevision instruction: ${instruction}\nPlatform: ${PLATFORM_LABELS[state.platform]||state.platform}\n\nReturn ONLY the revised English text for [${partKey}]. No explanation, no JSON, no quotes.`,
    }], '', 400)).trim();
    if (!revised) throw new Error('빈 응답');

    if (isCut) {
      if (state.multiShot.generatedShots[cutIdx])
        state.multiShot.generatedShots[cutIdx].parts[partKey] = revised;
    } else {
      state.generatedParts[partKey] = revised;
    }
    saveToStorage();

    const valEl = document.querySelector(`.prompt-part[data-key="${key}"] .part-val`);
    if (valEl) valEl.textContent = revised;
    cancelRevise(key);

  } catch (e) {
    if (confirmBtn) { confirmBtn.disabled = false; confirmBtn.textContent = '수정 적용'; }
    alert('수정 실패: ' + e.message);
  }
}

// ── Copy & helpers ────────────────────────────────
function copyFinalPrompt(btn) {
  const text = state.shotMode === 'multi'
    ? state.multiShot.generatedFinal
    : state.generatedFinal;
  const doCopy = () => {
    btn.textContent = '복사됨!'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '복사'; btn.classList.remove('copied'); }, 1800);
  };
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(text).then(doCopy).catch(() => fallbackCopy(text, doCopy));
  } else {
    fallbackCopy(text, doCopy);
  }
}
function fallbackCopy(text, cb) {
  const el = document.createElement('textarea');
  el.value = text; el.style.position = 'fixed'; el.style.opacity = '0';
  document.body.appendChild(el); el.select();
  document.execCommand('copy'); document.body.removeChild(el);
  cb();
}

// ── Toast ─────────────────────────────────────────
function toast(msg, type = 'info') {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const t = document.createElement('div');
  t.className = `toast${type !== 'info' ? ' ' + type : ''}`;
  t.textContent = msg;
  container.appendChild(t);
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('visible')));
  setTimeout(() => {
    t.classList.remove('visible');
    setTimeout(() => t.remove(), 300);
  }, 2400);
}

// ── Settings ──────────────────────────────────────
function toggleSettings(e) {
  e.stopPropagation();
  const dd = document.getElementById('settings-dropdown');
  if (!dd) return;
  const open = dd.classList.contains('open');
  dd.classList.toggle('open', !open);
  if (!open) updateStorageInfo();
}

function updateStorageInfo() {
  const item = document.getElementById('storage-info');
  if (!item) return;
  try {
    const raw = localStorage.getItem('revon_prompd') || '';
    const bytes = new Blob([raw]).size;
    const kb = (bytes / 1024).toFixed(1);
    const pct = ((bytes / (5 * 1024 * 1024)) * 100).toFixed(0);
    item.textContent = `💾 저장 용량: ${kb}KB / 5MB (${pct}%)`;
    item.style.color = bytes > 4 * 1024 * 1024 ? 'var(--red)' : '';
  } catch { item.textContent = '💾 용량 확인 불가'; }
}

function resetAllData() {
  if (!confirm('모든 시트, 샷, 프롬프트 데이터를 초기화할까요?\n이 작업은 되돌릴 수 없습니다.')) return;
  localStorage.removeItem('revon_prompd');
  location.reload();
}

// ── Stale banner in prompt output ─────────────────
function injectStaleBanner(container) {
  if (!state.promptStale) return;
  const banner = document.createElement('div');
  banner.className = 'stale-banner';
  banner.innerHTML = `⚠ 플랫폼이 변경되었습니다. 프롬프트를 재생성하세요.
    <button class="stale-regen-btn" onclick="generatePrompt()">재생성</button>`;
  container.insertBefore(banner, container.firstChild);
}

function showRightError(msg) {
  document.getElementById('right-panel-body').innerHTML = `
    <div class="prompt-error">${esc(msg)}</div>
    <div class="regen-row">
      <button class="btn-regen" onclick="generatePrompt()">다시 시도</button>
    </div>`;
}

function showRightLoading() {
  const names = { claude:'Claude', gpt:'ChatGPT', gemini:'Gemini' };
  const provName = names[state.apiProvider] || state.apiProvider.toUpperCase();
  document.getElementById('right-panel-body').innerHTML = `
    <div class="prompt-loading">

// ── Multi-shot generate ───────────────────────────
async function generateMultiPrompt() {
  if (!state.shots.length) { showRightError('컷을 먼저 추가하세요.'); return; }

  showRightLoading();

  try {
    const content = buildMultiUserContent();
    const raw = await callLLM([{ role:'user', content }], buildMultiSystemPrompt(), 1600);
    const jsonMatch = raw.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('응답 파싱 실패:\n' + raw.slice(0, 300));
    const parsed = JSON.parse(jsonMatch[0]);

    state.multiShot.generatedShots = parsed.shots || [];
    state.multiShot.generatedFinal = parsed.final || '';
    state.multiShot.generatedFinalKorean = parsed.final_korean || '';
    state.promptStale = false;
    document.getElementById('right-platform-badge')?.classList.remove('stale');
    saveToStorage();
    renderPromptOutput();

  } catch (e) {
    showRightError(e.message || '알 수 없는 오류');
  }
}

function buildMultiSystemPrompt() {
  const p = state.platform || 'kling';
  const baseRules = buildSystemPrompt().split('\nCRITICAL RULES:')[0];
  return `${baseRules}

You are generating prompts for MULTIPLE shots/cuts in sequence.

CRITICAL RULES:
1. All prompt text (parts, final) MUST be in English (translate Korean input).
2. Reference sheets: mention them as [SheetLabel] where relevant.
3. Maintain character/scene consistency across cuts.
4. SAFETY: Keep content suitable for AI video platforms. No explicit violence, sexual content, or policy-violating material.
5. Output ONLY a single valid JSON object — no markdown, no code fences.
6. JSON structure:
{
  "shots": [
    {
      "cutNumber": 1,
      "parts": {
        "인물": "<subject — omit if not relevant>",
        "장소": "<location — omit if not relevant>",
        "카메라": "<camera movement and framing>",
        "분위기": "<mood, style, lighting>",
        "대사": "<dialogue — omit if none>",
        "초수": "<e.g. 3s>"
      },
      "korean": {
        "인물": "<한글>",
        "장소": "<한글>",
        "카메라": "<한글>",
        "분위기": "<한글>",
        "초수": "<e.g. 3초>"
      }
    }
  ],
  "final": "<complete platform-ready English prompt with all shots>",
  "final_korean": "<한글로 전체 장면 흐름 요약 (2~3문장)>"
}
Always include 카메라, 분위기, 초수 in each shot's parts.`;
}

function buildMultiUserContent() {
  const content = [];
  let imgCounter = 1;

  // Collect unique refs across all shots
  const allRefs = [...new Set(state.shots.flatMap(s => s.refs || []))];

  allRefs.forEach(label => {
    if (label.startsWith('ri::')) {
      const ri = (state.refImages || []).find(r => r.id === label.slice(4));
      if (!ri) return;
      content.push({ type:'text', text:`=== Reference Image: [${ri.name}] ===` });
      content.push({ type:'image', source:{ type:'base64', media_type:ri.mimeType||'image/jpeg', data:ri.dataUrl.split(',')[1] }});
      imgCounter++;
      return;
    }
    const sheet = state.sheets[label];
    if (!sheet) return;
    content.push({ type:'text', text:`=== Reference Sheet: [${label}] (${sheet.category}) ===` });
    const fieldLines = Object.entries(sheet.fields)
      .filter(([,v]) => v && (Array.isArray(v)?v.length:String(v).trim()))
      .map(([k,v]) => `  ${k}: ${Array.isArray(v)?v.join(', '):v}`).join('\n');
    if (fieldLines) content.push({ type:'text', text: fieldLines });
    sheet.images.forEach(img => {
      content.push({ type:'text', text:`Image ${imgCounter} for [${label}]:` });
      content.push({ type:'image', source:{ type:'base64', media_type:img.mimeType||'image/jpeg', data:img.dataUrl.split(',')[1] }});
      imgCounter++;
    });
  });

  const CAM  = {'static':'Static','dolly-in':'Dolly in','dolly-out':'Dolly out','pan':'Panning','tilt-up':'Tilt up','tilt-down':'Tilt down','tracking':'Tracking','orbit':'Orbit','crane-up':'Crane up','handheld':'Handheld','drone':'Drone/aerial'};
  const SZLB = {'ews':'Extreme wide','ws':'Wide','fs':'Full','mws':'Medium wide','ms':'Medium','mcu':'Medium CU','cu':'Close-up','ecu':'Extreme CU'};
  const AGLB = {'eye-level':'Eye level','low':'Low angle','high':'High angle','bird':'Bird\'s eye','worm':'Worm\'s eye','dutch':'Dutch','ots':'OTS','pov':'POV'};

  const shotsDesc = state.shots.map((s, i) => {
    const lines = [
      `  Refs: ${s.refs.length ? s.refs.join(', ') : 'none'}`,
      s.shotSize   ? `  Shot size: ${SZLB[s.shotSize]||s.shotSize}` : '',
      s.angle      ? `  Angle: ${AGLB[s.angle]||s.angle}` : '',
      s.cameraMove ? `  Camera move: ${CAM[s.cameraMove]||s.cameraMove}` : '  Camera move: AI determines',
      s.duration   ? `  Duration: ${s.duration}s (fixed)` : '  Duration: AI determines',
      s.dialogue   ? `  Dialogue: "${s.dialogue}"` : '',
      s.memo       ? `  Memo: ${s.memo}` : '',
    ].filter(Boolean).join('\n');
    return `Cut ${i+1}:\n${lines}`;
  }).join('\n\n');

  const total = state.multiShot?.totalDuration;
  content.push({ type:'text', text:
    `\n=== Multi-Shot Settings ===\nPlatform: ${PLATFORM_LABELS[state.platform]||state.platform}\n` +
    (total ? `Total duration: ${total} seconds (distribute across cuts)\n` : '') +
    `Number of cuts: ${state.shots.length}\n\n${shotsDesc}\n\nGenerate prompts for all cuts. Return ONLY valid JSON.`
  });
  return content;
}

// ═══════════════════════════════════════════
// API KEY & PROVIDER
// ═══════════════════════════════════════════
function setApiProvider(prov) {
  state.apiProvider = prov;
  const models = PROVIDER_MODELS[prov] || [];
  // pick first model of provider if current model doesn't belong
  if (!models.find(([v]) => v === state.apiModel)) {
    state.apiModel = models[0]?.[0] || '';
  }
  // update tabs
  document.querySelectorAll('.api-provider-tab').forEach(t => t.classList.toggle('active', t.dataset.prov === prov));
  // update model select
  const sel = document.getElementById('api-model-select');
  if (sel) {
    sel.innerHTML = models.map(([v,l]) => `<option value="${v}">${l}</option>`).join('');
    sel.value = state.apiModel;
  }
  // update placeholder
  const placeholders = { claude:'sk-ant-api03-...', gpt:'sk-...', gemini:'AIzaSy...' };
  const inp = document.getElementById('api-key-input');
  if (inp) inp.placeholder = placeholders[prov] || 'API Key...';
  // load saved key for this provider
  const saved = localStorage.getItem(`revon_apikey_${prov}`) || '';
  if (inp) inp.value = saved ? saved.slice(0,8) + '••••••••' : '';
  updateApiStatus();
  saveToStorage();
}

function setApiModel(model) {
  state.apiModel = model;
  saveToStorage();
}

function saveApiKey() {
  const val = document.getElementById('api-key-input').value.trim();
  if (!val || val.includes('•')) { toast('API 키를 입력해주세요.', 'error'); return; }
  localStorage.setItem(`revon_apikey_${state.apiProvider}`, val);
  document.getElementById('api-key-input').value = val.slice(0,8) + '••••••••';
  updateApiStatus();
  toast(`${state.apiProvider.toUpperCase()} API 키가 저장되었습니다.`, 'success');
}

function updateApiStatus() {
  const el = document.getElementById('api-status');
  if (!el) return;
  const key = localStorage.getItem(`revon_apikey_${state.apiProvider}`) || '';
  const models = PROVIDER_MODELS[state.apiProvider] || [];
  const modelLabel = models.find(([v]) => v === state.apiModel)?.[1] || state.apiModel;
  if (key) {
    el.textContent = `✓ ${state.apiProvider.toUpperCase()} · ${modelLabel} 등록됨`;
    el.className = 'api-status ok';
  } else {
    el.textContent = `${state.apiProvider.toUpperCase()} 키 미등록`;
    el.className = 'api-status';
  }
}

function initApiSection() {
  const models = PROVIDER_MODELS[state.apiProvider] || [];
  const sel = document.getElementById('api-model-select');
  if (sel) {
    sel.innerHTML = models.map(([v,l]) => `<option value="${v}">${l}</option>`).join('');
    sel.value = state.apiModel;
  }
  const placeholders = { claude:'sk-ant-api03-...', gpt:'sk-...', gemini:'AIzaSy...' };
  const inp = document.getElementById('api-key-input');
  if (inp) inp.placeholder = placeholders[state.apiProvider] || 'API Key...';
  const saved = localStorage.getItem(`revon_apikey_${state.apiProvider}`) || '';
  if (inp) inp.value = saved ? saved.slice(0,8) + '••••••••' : '';
  document.querySelectorAll('.api-provider-tab').forEach(t => t.classList.toggle('active', t.dataset.prov === state.apiProvider));
  updateApiStatus();
}

function toggleApiKeyVis() {
  const input = document.getElementById('api-key-input');
  const btn   = document.getElementById('btn-eye');
  if (input.type === 'password') { input.type = 'text'; btn.style.color = 'var(--purple)'; }
  else { input.type = 'password'; btn.style.color = ''; }
}

// ═══════════════════════════════════════════
// LOCALSTORAGE
// ═══════════════════════════════════════════
function saveToStorage() {
  try {
    localStorage.setItem('revon_prompd', JSON.stringify({
      platform: state.platform,
      shotMode: state.shotMode,
      activeCategory: state.activeCategory,
      sheets: state.sheets,
      shots: state.shots,
      prompts: state.prompts,
      singleShot: state.singleShot,
      generatedParts: state.generatedParts,
      generatedKorean: state.generatedKorean,
      generatedFinal: state.generatedFinal,
      generatedFinalKorean: state.generatedFinalKorean,
      multiShot: state.multiShot,
      colWidths: state.colWidths,
      apiProvider: state.apiProvider,
      apiModel: state.apiModel,
      refImages: state.refImages,
    }));
  } catch (e) {
    console.warn('저장 실패 (용량 초과 가능):', e);
  }
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem('revon_prompd');
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.platform)       state.platform       = data.platform;
    if (data.shotMode)       state.shotMode       = data.shotMode;
    if (data.activeCategory) state.activeCategory = data.activeCategory;
    if (data.sheets)      state.sheets      = data.sheets;
    if (data.shots)       state.shots       = data.shots;
    if (data.prompts)     state.prompts     = data.prompts;
    if (data.singleShot)     state.singleShot     = { ...state.singleShot, ...data.singleShot };
    if (data.generatedParts)      state.generatedParts      = data.generatedParts;
    if (data.generatedKorean)     state.generatedKorean     = data.generatedKorean;
    if (data.generatedFinal)      state.generatedFinal      = data.generatedFinal;
    if (data.generatedFinalKorean)state.generatedFinalKorean= data.generatedFinalKorean;
    if (data.multiShot)           state.multiShot           = { ...state.multiShot, ...data.multiShot };
    if (data.colWidths)           state.colWidths           = data.colWidths;
    if (data.apiProvider)         state.apiProvider         = data.apiProvider;
    if (data.apiModel)            state.apiModel            = data.apiModel;
    if (data.refImages)           state.refImages           = data.refImages;

    if (state.shotMode === 'multi') {
      document.getElementById('btn-single').classList.remove('active');
      document.getElementById('btn-multi').classList.add('active');
      document.getElementById('center-panel-title').textContent = '멀티샷';
    }
    document.querySelectorAll('.cat-tab').forEach(t => {
      t.classList.toggle('active', t.dataset.cat === state.activeCategory);
    });
  } catch (e) {
    console.warn('불러오기 실패:', e);
  }
}

// ─── Utility: HTML escape ───
function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

// ─── Global: close dropdowns on outside click ───
document.addEventListener('click', () => {
  document.getElementById('ref-dropdown')?.classList.remove('open');
  document.getElementById('settings-dropdown')?.classList.remove('open');
  document.querySelectorAll('.shot-ref-dropdown.open').forEach(d => d.classList.remove('open'));
});

// ─── Keyboard shortcuts ───
document.addEventListener('keydown', e => {
  // Ctrl+Enter: generate prompt
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    generatePrompt();
  }
  // Escape: close all dropdowns
  if (e.key === 'Escape') {
    document.getElementById('ref-dropdown')?.classList.remove('open');
    document.getElementById('settings-dropdown')?.classList.remove('open');
    document.querySelectorAll('.shot-ref-dropdown.open').forEach(d => d.classList.remove('open'));
  }
});

// ═══════════════════════════════════════════
// COLUMN RESIZE
// ═══════════════════════════════════════════
let _rz = null;

document.addEventListener('mousedown', e => {
  const handle = e.target.closest('.col-rz');
  if (!handle) return;
  const th = handle.closest('th');
  _rz = { th, startX: e.clientX, startW: th.offsetWidth };
  handle.classList.add('rz-active');
  document.querySelector('.shot-table')?.classList.add('resizing');
  e.preventDefault();
});

document.addEventListener('mousemove', e => {
  if (!_rz) return;
  const newW = Math.max(40, _rz.startW + (e.clientX - _rz.startX));
  _rz.th.style.width = newW + 'px';
});

document.addEventListener('mouseup', () => {
  if (!_rz) return;
  document.querySelectorAll('.col-rz.rz-active').forEach(h => h.classList.remove('rz-active'));
  document.querySelector('.shot-table')?.classList.remove('resizing');
  saveColWidths();
  _rz = null;
});

function saveColWidths() {
  const ths = document.querySelectorAll('.shot-table thead th');
  if (!ths.length) return;
  state.colWidths = Array.from(ths).map(th => th.style.width || '');
  saveToStorage();
}

function restoreColWidths() {
  if (!state.colWidths?.length) return;
  const ths = document.querySelectorAll('.shot-table thead th');
  state.colWidths.forEach((w, i) => { if (w && ths[i]) ths[i].style.width = w; });
}

// ─── Start ───
init();
</script>
